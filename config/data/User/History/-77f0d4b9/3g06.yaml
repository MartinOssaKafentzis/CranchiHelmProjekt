# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

frontend:
  themes:
    custom_dialog_theme:
      # --- Dunkles Design (Base Dark Mode) ---
      primary-color: "#03a9f4"
      accent-color: "#ff9800"
      dark-primary-color: "#0288d1"
      light-primary-color: "#b3e5fc"
      primary-text-color: "#e1e1e1"
      secondary-text-color: "#9b9b9b"
      disabled-text-color: "#6f6f6f"
      primary-background-color: "#111111"
      secondary-background-color: "#202020"
      card-background-color: "#1c1c1c"
      dialog-background-color: "#1c1c1c"
      paper-listbox-background-color: "#191919"
      scrim-color: "rgba(0, 0, 0, 0.75)"
      
      # Richtet alle Dialoge & Pop-ups auf x = 425px aus
      card-mod-theme: custom_dialog_theme
      card-mod-more-info-yaml: |
        $: |
          .mdc-dialog,
          ha-dialog,
          ha-adaptive-dialog,
          ha-md-dialog {
            left: 425px !important;
            right: auto !important;
            transform: translateX(-50%) !important;
            margin: 0 !important;
          }
        .: |
          :host {
            --mdc-dialog-min-width: 500px;
          }
          ha-more-info-dialog,
          ha-dialog,
          ha-adaptive-dialog,
          ha-md-dialog {
            left: 425px !important;
            right: auto !important;
            transform: translateX(-50%) !important;
            margin: 0 !important;
          }                  
          
# Marine-Sensoren für das Cranchi Helm Dashboard
# 1. Deine Sensoren (Berechnen den Zielwert aus Lux)
template:
  - sensor:
      - name: "Steuerstand Display Zielhelligkeit"
        unique_id: steuerstand_display_zielhelligkeit
        unit_of_measurement: "%"
        icon: mdi:brightness-auto
        state: >-
          {% set min_b   =    5 %}
          {% set max_b   =  100 %}
          {% set min_lux =    2 %}
          {% set max_lux = 2000 %}
          {% set lux = states('sensor.cranchi_helm_node_umgebungslicht') | float(0) %}
          {% if lux >= max_lux %}
            {{ max_b }}
          {% elif lux <= min_lux %}
            {{ min_b }}
          {% else %}
            {{ ((lux - min_lux) * (max_b - min_b) / (max_lux - min_lux) + min_b) | round }}
          {% endif %}

      - name: "Boat Marine Position Pack"
        unique_id: boat_marine_position_pack
        state: "{{ now().isoformat() }}"
        attributes:
          latitude:  "{{ states('sensor.gps_latitude')  | float(0) }}"
          longitude: "{{ states('sensor.gps_longitude') | float(0) }}"
          heading:   "{{ states('sensor.gps_heading')   | float(0) }}"

  - light:
      - name: "Cranchi Helm Monitor"
        unique_id: cranchi_helm_monitor_light
        state: "{{ is_state('shell_command.set_helm_display_brightness', 'ok') }}"
        turn_on:
          action: shell_command.set_helm_display_brightness
          data:
            brightness: 100
        turn_off:
          action: shell_command.set_helm_display_brightness
          data:
            brightness: 5
        set_level:
          action: shell_command.set_helm_display_brightness
          data:
            brightness: "{{ brightness }}"


shell_command:
  set_helm_display_brightness: 'ssh -i /config/.ssh/id_ed25519 -o StrictHostKeyChecking=no martin@192.168.12.90 "ddcutil --bus 14 setvcp 10 {{ brightness }} --noverify; sleep 0.1; ddcutil --bus 14 setvcp 10 {{ brightness }} --noverify"'
  save_route_to_synology: 'python3 /config/scripts/export_gpx.py'

