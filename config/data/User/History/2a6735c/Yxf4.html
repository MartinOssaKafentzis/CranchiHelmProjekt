<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Verhindert 403-Sperren bei Kachel-Servern -->
  <meta name="referrer" content="no-referrer-when-downgrade" />
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    html, body, #map {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #1a1a1a;
    }

    /* Buttons oben rechts */
    .nav-buttons {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .nav-btn {
      width: 42px;
      height: 42px;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .nav-btn:active {
      background: #e2e8f0;
    }
    .nav-btn svg {
      width: 24px;
      height: 24px;
      fill: #1e293b;
    }

    /* Zoom-Anzeige unten links */
    .zoom-display {
      background: rgba(255, 255, 255, 0.9);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #333;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Buttons mit SVG Icons (funktioniert auf jedem Display) -->
  <div class="nav-buttons">
    <button class="nav-btn" onclick="moveToPosition()" title="Boot zentrieren">
      <!-- Boot / Kompass Icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
      </svg>
    </button>
    <button class="nav-btn" onclick="moveToTarget()" title="Ziel zentrieren">
      <!-- Fadenkreuz Icon -->
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.54-7.49-7.49H7v-2h1.51c.49-3.95 3.54-7 7.49-7.49V5h2v1.51c3.95.49 7 3.54 7.49 7.49H17v2h-1.51zM12 8c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 6c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
      </svg>
    </button>
  </div>

  <script>
    var amfilochiaPos = [38.896, 21.160];
    var boatPos = amfilochiaPos;
    var targetPos = [38.890, 21.150];

    var map = L.map('map').setView(amfilochiaPos, 14);

    // 1. Esri World Topo Map (Absolut zuverlässig, blockiert niemals mit 403)
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 19,
      maxNativeZoom: 18,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    // 2. OpenSeaMap Seezeichen Overlay
    L.tileLayer('https://tiles.openseamap.org/seamark/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenSeaMap'
    }).addTo(map);

    // Zentrieren
    function moveToPosition() {
      map.flyTo(boatPos, map.getZoom());
    }

    function moveToTarget() {
      map.flyTo(targetPos, map.getZoom());
    }

    // Custom Control für Zoom unten links
    const ZoomControl = L.Control.extend({
      options: { position: 'bottomleft' },
      onAdd: function(map) {
        const container = L.DomUtil.create('div', 'zoom-display');
        container.innerHTML = 'Zoom: ' + map.getZoom();

        map.on('zoomend', function() {
          container.innerHTML = 'Zoom: ' + map.getZoom();
        });

        return container;
      }
    });
    map.addControl(new ZoomControl());

    // Kachel-Berechnung erzwingen
    setTimeout(function() {
      map.invalidateSize();
    }, 200);
  </script>
</body>
</html>
