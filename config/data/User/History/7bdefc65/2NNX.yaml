# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Marine-Sensoren für das Cranchi Helm Dashboard
template:
  - sensor:
      - name: "Boot Geschwindigkeit km/h"
        unique_id: boat_speed_kmh
        unit_of_measurement: "km/h"
        icon: mdi:speedometer
        state: >
          {{ (states('sensor.boot_geschwindigkeit_kn') | float(0) * 1.852) | round(1) }}

sensor:
  - platform: filter
    name: "Umgebungslicht"
    entity_id: sensor.umgebungslicht_raw
    filters:
      - filter: lowpass
        time_constant: 10
        precision: 0

shell_command:
  set_display_brightness: 'sh -c "echo {{ brightness }} > /config/brightness.txt"'
  save_route_to_synology: 'python3 /config/scripts/export_gpx.py'

