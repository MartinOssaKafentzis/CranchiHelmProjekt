# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Marine-Sensoren für das Cranchi Helm Dashboard
template:
  - sensor:
      - name: "Boot Geschwindigkeit km/h"
        unique_id: boat_speed_kmh
        unit_of_measurement: "km/h"
        icon: mdi:speedometer
        state: >
          {{ (states('sensor.boot_geschwindigkeit_kn') | float(0) * 1.852) | round(1) }}

light:
  - platform: template
    lights:
      cranchi_helm_display:
        friendly_name: "Cranchi Helm Monitor"
        turn_on:
          action: shell_command.set_helm_display_brightness
          data:
            brightness: 100
        turn_off:
          action: shell_command.set_helm_display_brightness
          data:
            brightness: 10
        set_level:
          action: shell_command.set_helm_display_brightness
          data:
            brightness: "{{ (brightness / 2.55) | round }}"

shell_command:
  set_helm_display_brightness: 'ssh -i /config/.ssh/id_rsa -o StrictHostKeyChecking=no martin@localhost "ddcutil setvcp 10 {{ brightness }}"'
  save_route_to_synology: 'python3 /config/scripts/export_gpx.py'

