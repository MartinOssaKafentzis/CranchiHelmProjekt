# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Marine-Sensoren für das Cranchi Helm Dashboard
template:
  - sensor:
      - name: "Boot Geschwindigkeit km/h"
        unique_id: boat_speed_kmh
        unit_of_measurement: "km/h"
        icon: mdi:speedometer
        state: >
          {{ (states('sensor.boot_geschwindigkeit_kn') | float(0) * 1.852) | round(1) }}

panel_iframe:
  config_editor:
    title: "Code Editor"
    icon: "mdi:code-braces"
    url: "http://192.168.10.91:8444"

shell_command:
  set_display_brightness: "/config/set_brightness.sh set {{ brightness }}"